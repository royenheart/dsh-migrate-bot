# Overlay on dsh-base + dsh-headless for the migrate profile.
# Whole-row patches restated (cordis replaces config by id).
- id: agent-default-model
  config:
    provider: !!js process.env.DSH_MIGRATE_PROVIDER || 'deepseek-official'
    model: !!js process.env.DSH_MIGRATE_MODEL || 'deepseek-v4-flash'

- id: llm-deepseek
  config:
    thinking: !!js process.env.DSH_MIGRATE_THINKING || 'enabled'
    reasoningEffort: !!js process.env.DSH_MIGRATE_EFFORT || 'max'

- id: headless-runner
  disabled: true

# The DeepSeek request decoration that reports the active plugin inventory.
# It resolves every active Loader row to its owning package and throws when one
# has no resolvable manifest, which fails the whole request as REQUEST_EXTENSION
# — what a profile that mounts a preset hits on dsh 0.1.2-alpha.2, where the
# stock profile does not because it mounts no preset. A migration session does
# not need the decoration, and not sending the plugin inventory to the model
# provider is the smaller request.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    - id: dsh-migrate-runner
      name: './migrate-runner.js'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
