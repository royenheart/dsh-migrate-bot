name: DSH Plugin Migrate Bot
description: Migrate a DeepSeek Harness plugin to new dsh-v* releases, and propose the change as a pull request.
author: royenheart
branding:
  icon: refresh-cw
  color: blue
inputs:
  command:
    description: run, pull-request-closed, comment, check, or status
    required: false
    default: run
  workdir:
    description: The plugin checkout, relative to the workspace
    required: false
    default: '.'
  config:
    description: The configuration file, relative to the plugin checkout
    required: false
    default: .github/dsh-migrate.yml
  target:
    description: Override the configured target release (latest, a version, or a dsh-v* tag)
    required: false
    default: ''
  force:
    description: run only. Migrate even when the target release was already processed, unless its proposal is still open
    required: false
    default: 'false'
  skip_github:
    description: run only. Do not publish a proposal
    required: false
    default: 'false'
  pull_request:
    description: pull-request-closed only. The number of the closed pull request
    required: false
    default: ''
  merged:
    description: pull-request-closed only. Whether it was merged (true or false)
    required: false
    default: ''
  comment_body:
    description: comment only. The comment text
    required: false
    default: ''
  comment_id:
    description: comment only. The comment id; a second delivery of the same comment has no second effect
    required: false
    default: ''
  comment_author:
    description: comment only. The commenter's login
    required: false
    default: ''
  comment_author_association:
    description: comment only. The comment's author_association; OWNER, MEMBER and COLLABORATOR may run commands
    required: false
    default: ''
  issue_number:
    description: comment only. The issue or pull request the comment is on
    required: false
    default: ''
outputs:
  status:
    description: compatible, proposed, unpublished, failed, error, skipped, or the state an event left the migration in
  target_tag:
    description: The target release tag
  verified_tag:
    description: The newest verified release tag
  badge_message:
    description: The badge message on the state branch
  pull_request_url:
    description: The proposal pull request, when there is one
  log_stream_url:
    description: The run log stream, when a deploy service serves one
  command_reply:
    description: comment only. The reply posted on the thread
runs:
  using: docker
  # Built, self-tested and published by the release workflow; the version is
  # bumped with the release.
  image: docker://ghcr.io/royenheart/dsh-migrate-bot:v1.0.0-rc.1
