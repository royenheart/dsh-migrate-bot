# A pushed vX.Y.Z tag publishes the Action's image, then moves the major tag
# (v1, v2, …) consumers pin. The image is pushed before the major tag moves, so
# a consumer never resolves a tag whose image does not exist. A prerelease tag,
# vX.Y.Z-rc.N, publishes its image and a GitHub prerelease and moves no major
# tag: only a consumer who pins it runs it.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: The vX.Y.Z tag the major tag should point to
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The build runs `dsh-migrate self-test`, so an image whose agent runtime
      # cannot start a session fails here and is never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  major-tag:
    needs: image
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - name: Move the major tag
        if: ${{ !contains(env.TAG, '-') }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected vMAJOR.MINOR.PATCH, got $TAG"
            exit 1
          fi
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push origin "refs/tags/$major" --force
          echo "pointed $major at $TAG"
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
