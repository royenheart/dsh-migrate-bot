# Build the Action's image when what goes into it changes. The build runs the
# agent runtime self-test, so a runtime that cannot start a session fails here
# rather than in a consumer's run.

name: image

on:
  pull_request:
    paths:
      - Dockerfile
      - container/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - Dockerfile
      - container/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
