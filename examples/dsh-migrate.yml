# Copy to .github/dsh-migrate.yml in the plugin repository.
# Schedule lives in the workflow file, not here — GitHub only honors on.schedule there.

dshVersion: latest

dsh:
  provider: deepseek-official
  model: deepseek-v4-flash
  thinking: enabled
  reasoningEffort: max
  # dsh agent preset id. Shipped with @deepseek-ai/dsh-agent-presets:
  # standard, minimal, cordis, ptc.
  mode: standard

review:
  # always | skip-if-mechanical-pass
  # skip-if-mechanical-pass is for plugins whose npm test already proves host
  # behavior, usage, and UI against the pinned target @deepseek-ai/dsh-* packages.
  policy: always

# Skip the pipeline when dsh-v* is unchanged since the last successful run.
# First run (no dsh-migrate/state seen.json yet) always proceeds.
watch:
  enabled: true

# Repository secret / env var that holds the DeepSeek API key.
# secrets:
#   apiKeyEnv: MY_DEEPSEEK_KEY

# Uncomment to **replace** (not append) the built-in mechanical suite.
# tests:
#   commands:
#     - npm test
#     - npm run typecheck

# prompts:
#   absorption: |
#     custom A
#   alignment: |
#     custom B
#   fix: |
#     custom C

issuePr:
  language: en

loop:
  maxAttempts: 5

# Optional cap on this Action run's official USD estimate (not account-wide spend).
# Also available as the Action input quota_limit. Insufficient official balance
# always aborts, even when this is unset.
# quota:
#   limit: 2

# Feedback: after a migrate pull request is MERGED, report it to the channels you
# enable. Every channel is off by default and needs its own token, because none
# of these targets is the plugin repository your GITHUB_TOKEN belongs to.
# A channel that is on without its token is skipped and logged, never an error.
