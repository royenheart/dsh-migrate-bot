# Copy to .github/workflows/dsh-migrate.yml in the plugin repository, set
# the cron, and pin the release: `@v1` exists once 1.0.0 is released, and a
# release candidate is pinned by its tag (docs/operations/release.md). The
# jobs live in the reusable workflow this calls; this file only chooses the
# triggers. docs/operations/install.md explains every part.

name: dsh-migrate

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Target release (empty = the configured one)
        required: false
        type: string
      force:
        description: Migrate even when the target release was already processed, unless its proposal is still open
        required: false
        type: boolean
        default: false
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-migrate:
    uses: royenheart/dsh-migrate-bot/.github/workflows/migrate.yml@v1
    with:
      target: ${{ inputs.target || '' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
